<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="cross-cut">
      <rect width="100" height="100" fill="white"/>
      <rect x="30" y="0" width="10" height="100" fill="black"/>
      <rect x="0" y="58" width="100" height="10" fill="black"/>
    </mask>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4e00" />
      <stop offset="100%" stop-color="#e50000" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#fire)" mask="url(#cross-cut)"/>
</svg>
